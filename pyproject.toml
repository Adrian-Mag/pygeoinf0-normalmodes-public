[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeoinf0-normalmodes"
version = "0.9.0"
description = "Normal-mode splitting data and PREM-layer sensitivity kernels: clean catalogue, kernel functions, forward maps, global Earth models on harmonic bases (a pygeoinf0 plugin)"
requires-python = ">=3.11"
license = "BSD-3-Clause AND LGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{ name = "Marin Adrian Mag" }]
dependencies = ["pygeoinf0 @ git+https://github.com/Adrian-Mag/pygeoinf0-public@v0.3.0", "numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib"]
models = ["netCDF4"]

[project.entry-points."pygeoinf0.plugins"]
normalmodes = "pygeoinf0_normalmodes:PLUGIN"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pygeoinf0_normalmodes.earthmodels" = ["data/*.npz"]
